<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Usuarios</title>

  <!-- Icons -->
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" type="image/x-icon">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename=mobile_icon_file) }}">

  <!-- Manifest and mobile metadata -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#122668">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Specific login CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/login.css') }}">

  <!-- FontAwesome (optional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-messages">
          {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
      </div>
      {% endif %}
      {% endwith %}
      <!-- Centered logo -->
      <div class="logo">
        <img 
            src="{{ url_for('static', filename='img/logo_real.jpg') }}" 
            onerror="this.onerror=null; this.src='{{ url_for('static', filename='img/logo_placeholder.jpg') }}'"
            alt="Logo de la empresa"
        >
      </div>
      <h1>Iniciar Sesión</h1>
      <form action="{{ url_for('auth.login') }}" method="POST">
        <div class="form-group">
          <label for="username"><i class="fas fa-user"></i> Usuario</label>
          <input type="text" id="username" name="username" placeholder="Introduce tu usuario" required>
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required>
        </div>
        <button type="submit" class="btn-login">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
