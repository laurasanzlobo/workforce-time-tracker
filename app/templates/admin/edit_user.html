{% extends "main/base.html" %}
{% block header %}Editar Usuario{% endblock %}
{% block extra_styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/edit_user.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="form-container">
  <h2>Editar datos de {{ user.username }}</h2>

  <form action="{{ url_for('admin.edit_user', user_id=user.id, back=back_url) }}" autocomplete="off"
        method="POST" enctype="multipart/form-data">

    <div class="input-group">
      <i class="fa-solid fa-user"></i>
      <input type="text" name="username"
             value="{{ user.username }}" required>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="text" name="password"
             placeholder="Nueva contraseña (dejar vacío para no cambiar)">
    </div>

    <div class="input-group">
      <i class="fa-solid fa-id-card"></i>
      <input type="text" name="full_name"
             value="{{ user.full_name }}" required>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-address-card"></i>
      <input type="text" name="national_id"
             value="{{ user.national_id }}" required>
    </div>

    <div class="select-group">
      <i class="fa-solid fa-briefcase"></i>
      <select name="worker_type" required>
        <option value="office" {{ 'selected' if user.worker_type=='office' else '' }}>Oficina</option>
        <option value="part_time" {{ 'selected' if user.worker_type=='part_time' else '' }}>Media jornada</option>
        <option value="site" {{ 'selected' if user.worker_type=='site' else '' }}>Obra</option>
      </select>
    </div>
    
    <div class="input-group">
      <i class="fa-solid fa-calendar-day"></i>
      <input type="text" name="start_date" class="flatpickr-date"
             value="{{ user.start_date.strftime('%d-%m-%Y') if user.start_date else '' }}"
             placeholder="Fecha de alta" required>
    </div>
    
    <div class="input-group">
        <i class="fa-solid fa-calendar-day"></i>
          
        <input type="text" id="input_end_date" name="end_date" 
            class="flatpickr-date" 
            value="{{ user.end_date.strftime('%d-%m-%Y') if user.end_date else '' }}"
            placeholder="Fecha de baja (opcional)">
                 
        <i class="fa-solid fa-xmark btn-clear" onclick="clearDate()" title="Quitar fecha de baja"></i>
    </div>


    <div class="input-group">
      <i class="fa-solid fa-file-signature"></i>
      <input type="file" name="signature">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" name="is_admin" id="is_admin"
             {{ 'checked' if user.is_admin else '' }}>
      <label for="is_admin">Administrador</label>
    </div>

    <div class="btn-group">
      <button type="submit" class="btn">Guardar</button>
      <a href="{{ back_url }}" class="btn">Cancelar</a>
    </div>

  </form>
</div>

<script>
    function clearDate() {
        // 1. Select the input by its ID
        const input = document.getElementById('input_end_date');
        
        // 2. Clear the value visually
        input.value = '';
        
        // 3. If using Flatpickr, notify it to clear its internal memory
        // (This prevents the date from remaining selected if you reopen the calendar)
        if (input._flatpickr) {
            input._flatpickr.clear();
        }
    }
</script>
{% endblock %}
